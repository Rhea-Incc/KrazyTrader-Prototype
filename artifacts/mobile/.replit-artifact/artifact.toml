kind = "mobile"
previewPath = "/mobile/"
title = "KrazyTrader"
description = "An Android-focused mobile prototype foundation for Kenyan boda-boda and three-wheeler riders, with a shared design system, navigable screens, fictional local demo data, and reusable interface components."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
